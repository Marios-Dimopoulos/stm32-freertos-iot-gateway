# local.conf of the gateway image build (Phase 3), the settings I gave BitBake.
#
# This is a TRIMMED copy of ~/yocto/build/conf/local.conf: the template that Yocto
# generates has about 300 lines of explanatory comments, which I dropped. Every line
# that is not a comment is exactly the same as in the file that built the image
# (checked by comparing the two files with the comments and blank lines removed), and
# the order is the same. The comments here are mine and say why a line is there.
#
# Operators: `=` sets the value; `?=` sets it only if nobody set it yet; `??=` is a weak
# default that loses to any other assignment; `+=` appends; `:perl` is an override that
# makes the line apply to the recipe `perl` only.

# ---- Lines that came with the template ---------------------------------------------

# The template's default target is an emulated PC. It is a weak default (`??=`), so the
# `MACHINE =` line further down wins.
MACHINE ??= "qemux86-64"

# Records how long every task takes. I read the build times in ADR-0011 from it.
USER_CLASSES ?= "buildstats"

# If a patch does not apply, fail the build instead of asking questions on the terminal.
PATCHRESOLVE = "noop"

# Safety check against filling the disk: stop the tasks (or halt the build) when the free
# space or the free inodes of these folders get too low.
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

# Version of the template this file was made from.
CONF_VERSION = "2"

# ---- Lines I added ------------------------------------------------------------------

# The board: Raspberry Pi Zero 2 W, 64-bit. BitBake looks for
# conf/machine/raspberrypi0-2w-64.conf in meta-raspberrypi. The name without `-64` is a
# different machine, so this must match a file name exactly.
MACHINE = "raspberrypi0-2w-64"

# The distribution settings (name, version, defaults): meta-poky's conf/distro/poky.conf.
# It is the "Poky 6.0.4" in the login banner.
DISTRO = "poky"

# A variable of meta-raspberrypi (not of Yocto itself): puts `enable_uart=1` in config.txt
# and makes the serial port the console. Without it I would have no way to see the boot.
ENABLE_UART = "1"

# The Wi-Fi firmware (linux-firmware-rpidistro) has a restrictive license that BitBake
# refuses to build until the flag is accepted. See ADR-0013.
LICENSE_FLAGS_ACCEPTED = "synaptics-killswitch"

# WORKAROUND: the `perl` package failed the `buildpaths` quality check (paths of the build
# machine left in its files). This turns that check off for `perl` only. I did not find the
# cause. See ADR-0014.
INSANE_SKIP:perl += "buildpaths"

# The IMAGE_FEATURES (OpenSSH, root login) are in the image recipe, gateway-image.bb, since
# 2026-10-24: here they applied to every image.

# Turns on the Pi's SPI controller: meta-raspberrypi then writes `dtparam=spi=on` into
# config.txt (recipe rpi-config). Phase 4 needs it for the link to the STM32.
ENABLE_SPI_BUS = "1"
