# LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
LCONF_VERSION = "7"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

# ${TOPDIR} is the build folder (~/yocto/build). The layers sit next to it in ~/yocto/, so the
# paths are relative to it and do not contain my user name or home folder. This only works while
# the layout stays: build/ and all the layers in the same parent folder.
BBLAYERS ?= " \
  ${TOPDIR}/../openembedded-core/meta \
  ${TOPDIR}/../meta-yocto/meta-poky \
  ${TOPDIR}/../meta-raspberrypi \
  ${TOPDIR}/../meta-gateway \
  ${TOPDIR}/../meta-openembedded/meta-oe \
  ${TOPDIR}/../meta-openembedded/meta-python \
  ${TOPDIR}/../meta-openembedded/meta-networking \
  "
