# Configuration of the MQTT broker on the gateway (ADR-0020, ADR-0021).
#
# The broker accepts connections only from the Pi itself. The publisher program runs on the
# Pi and connects to localhost:1883. To look at the messages from my laptop I use an SSH
# tunnel (ssh -L 1883:localhost:1883 root@<pi>), so MQTT adds no open port and no secret to
# the gateway.
#
# I write both lines on purpose and do not rely on the defaults of Mosquitto 2.x, because I
# read them only in forum posts and not in the official documentation.

# Listen on the loopback address only. Without an address after the port, the listener would
# be on every interface, including wlan0.
listener 1883 127.0.0.1

# No user name or password. This is safe here only because of the line above: the only
# programs that can connect are the ones that already run on the Pi (or reach it through my
# SSH login). If the listener ever moves to the Wi-Fi address, this line must go and a password
# file must come in (new ADR; and TLS needs a clock first).
allow_anonymous true
